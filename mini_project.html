<!DOCTYPE html>
<head>

    <title>Weather-App(24BCE0176)</title>

    <link id="theme" rel="stylesheet" href="project.css"/>

    <style>

        #container
        {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            gap: 5px;
        }

        .box
        {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

    </style>
</head> 
<body style="display: flex; justify-content: center; ">
   
    <div style="display:block; justify-content: center;padding: 30px; border: 2px solid white; border-radius: 20px; margin: 100px; width:45%; " id="app-background"> 
        <div style="border: white 10px double;border-radius: 10px; padding: 5px 45px;" id="weather-forecast"> 
            <p style="font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif, Times, serif; font-size: 40px;text-align: center; font-weight:700;">&rightarrow;Weather App&leftarrow;</p>
        </div>
        <br>
        <form>
            <div id="unit-temperature">
            <p style="font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif, Times, serif; font-size: 18px;text-align: left; font-weight:700; " >UNIT FOR TEMPERATURE</p>
            <input type="radio" name="temperature" value="Celsius" id="w-celsius">
            <label style="font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif, Times, serif; font-size: 18px;text-align: left; font-weight:700;">Celsius</label>
            <input type="radio" name="temperature" value="Fahrenheit" id="w-fahrenheit">
            <label style="font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif, Times, serif; font-size: 18px;text-align: left; font-weight:700;">Fahrenheit</label>
            </div>
        <br> 
        <br>
        <div id="search-city">
        <p style="font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif, Times, serif; font-size: 30px; font-weight:700;margin-left: 30px;">Search City</p>
        <select style="height: 35px;width: 125;margin-left: 30px; padding-right: 10px; font-family: 'Courier New', Courier, monospace; font-size: 20px; " name="City">
            <option>Chennai</option>
            <option>Shimla</option>
            <option>Trichy</option>
            <option>Bangalore</option>
        </select>
        <input style="margin-left: 10px; height:35px;width: 105px ;" type="button" value="Submit" onclick="DisplayWeather(this.form)" class="submit-button"/>

        </div>
        </form>
        <br>
        <br>
        <br>

        <div id="current-weather" style="border:1px solid white;border-radius:15px;margin: 35px">
            <p style="font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif, Times, serif; font-size: 40px;text-align: center; font-weight:700;">&centerdot;&nbsp;Current Weather&nbsp;&centerdot;</p>
            <br>
            <hr>
            <ul>
            <li style="margin-left:30px; " id="weather"></li>
            <li style="margin-left:30px; " id="place"></li>
            <li style="margin-left:30px; " id="temperature"></li>
            <li style="margin-left:30px; " id="Humidity"></li>
            <li style="margin-left:30px; " id="Wind"></li>
            </ul>
        </div>
        <br>

            <b><p style="margin:30px; font-size:30px;" id="warning"></p></b>

        <div id="warning-board">
            <p  class="warning" style="font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif, Times, serif; font-size: 18px;text-align: left; margin-left: 30px;" id="precaution"></p>
        </div>
        <hr>
        <div id="weather-box" style="border:1px solid white;border-radius:15px;margin: 35px;">
            <p style="font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif, Times, serif; font-size: 40px;text-align: left; font-weight:700;text-align: center;">4 Day Forecast </p>

            <div id="container">
                <div class="box" id="box-1">
                    <img src="box-1.png" height="185px" width="160px"/>
                </div>
                <div class="box" id="box-2">
                    <img src="box-2.png" height="185px" width="160px"/>
                </div>
                <div class="box" id="box-3">
                    <img src="box-3.png" height="185px" width="160px"/>
                </div>
                <div class="box" id="box-4">
                    <img src="box-4.png" height="185px" width="160px"/>
                </div>
            </div>

        </div>
        <br>
        <br>
        <br>
        <hr>
        <footer style="padding-top: 5px;text-align: center; font-size: 18px;">RAMPRASATH RP | 24BCE0176 | &copy; Rights Resereved | PRP-231 </footer>
    </div>

    <script>
        function DisplayWeather(form)
        {

            
            const city = form.elements['City'].value;
            const format = form.elements['temperature'].value;
            const temp = document.getElementById("temperature");
            const place = document.getElementById("place");
            const humidity = document.getElementById("Humidity");
            const wind = document.getElementById("Wind");
            const precaution = document.getElementById("precaution");
            const warning = document.getElementById("warning");
            const weather = document.getElementById("weather");
            const theme = document.getElementById("theme");

            if (!format)
            {
                alert("Temperature in Celsius or Fahrenheit");
                return;
            }

            if (city==="Chennai")
            {
                const tempr = "36.7";
                const temp_f = `${9/5*Number(tempr)+32}`;
                if (format==="Celsius")
                {
                    weather.innerHTML = "Weather : Sunny";
                    place.innerHTML = `Place : ${city}`;
                    temp.innerHTML = `Temperature : ${tempr} C`;
                    humidity.innerHTML = "Humidity : 35%";
                    wind.innerHTML = "Wind Speed : 12 km/h";
                }
                else
                {
                    weather.innerHTML = "Weather : Sunny";
                    place.innerHTML = `Place : ${city}`;
                    temp.innerHTML = `Temperature : ${Number(temp_f).toFixed(1)} °F`;                    
                    humidity.innerHTML = "Humidity : 35%";
                    wind.innerHTML = "Wind Speed : 12 km/h";
                }


                theme.href="sunny.css";



                if (Number(tempr)>=36)
                {

                    precaution.style.backgroundColor = "rgb(193, 112, 112)";
                    precaution.innerHTML = "It's hot, please wear loose clothes and wear sunscreen while going out";


                    warning.innerHTML = "Warning:";
                }
                else if (Number(tempr)<=20)
                {
                    precaution.style.backgroundColor = "rgb(193, 112, 112)";
                    precaution.innerHTML = "It's cold, please wear tight clothes and wear moisturizer while going out";

                    warning.innerHTML = "Warning:";
                }
                else
                {
                    precaution.style.backgroundColor = "rgb(103, 150, 103)";
                    precaution.innerHTML = "Enjoy the pleasent weather";    
                }


            }
            else if (city==="Bangalore")
            {
                weather.innerHTML = "Weather : Cloudy";
                const tempr = "21.5";
                const temp_f = `${9/5*Number(tempr)+32}`;

                theme.href="project.css";

                if (format==="Celsius")
                {
                    place.innerHTML = `Place : ${city}`;

                {

                }


                    precaution.style.backgroundColor = "rgb(103, 150, 103)";
                    precaution.innerHTML = "Enjoy the pleasent weather";    


            }
            else if (city==="Shimla")
            {
                const tempr = "17.2";
                const temp_f = `${9/5*Number(tempr)+32}`;

                theme.href="snowstorm.css";
                if (format==="Celsius")
                {
                    weather.innerHTML = "Weather : Snowstorm";
                    place.innerHTML = `Place : ${city}`;
                    temp.innerHTML = `Temperature : ${tempr} C`;
                    humidity.innerHTML = "Humidity : 35%";
                    wind.innerHTML = "Wind Speed : 12 km/h";
                }
                else
                {
                    weather.innerHTML = "Weather : Snowstorm";
                    place.innerHTML = `Place : ${city}`;
                    temp.innerHTML = `Temperature : ${Number(temp_f).toFixed(1)} °F`;                    
                    humidity.innerHTML = "Humidity : 35%";
                    wind.innerHTML = "Wind Speed : 12 km/h";
                }


                if (Number(tempr)>=36)
                {
                    precaution.style.backgroundColor = "rgb(193, 112, 112)";
                    precaution.innerHTML = "It's hot, please wear loose clothes and wear sunscreen while going out";




                    warning.innerHTML = "Warning:";
                }
                else if (Number(tempr)<=20)
                {
                    precaution.style.backgroundColor = "rgb(193, 112, 112)";
                    precaution.innerHTML = "It's cold, please wear tight clothes and wear moisturizer while going out";
                    warning.innerHTML = "Warning:";
                }
                else
                {
                    precaution.style.backgroundColor = "rgb(103, 150, 103)";
                    precaution.innerHTML = "Enjoy the pleasent weather";    
                }

            }
            else if (city==="Trichy")
            {
                const tempr = "39.7";
                const temp_f = `${9/5*Number(tempr)+32}`;

                theme.href="sunny.css";
                if (format==="Celsius")
                {
                    weather.innerHTML = "Weather : Sunny";
                    place.innerHTML = `Place : ${city}`;
                    temp.innerHTML = `Temperature : ${tempr} C`;
                    humidity.innerHTML = "Humidity : 35%";
                    wind.innerHTML = "Wind Speed : 12 km/h";
                }
                else
                {
                    weather.innerHTML = "Weather : Sunny";
                    place.innerHTML = `Place : ${city}`;
                    temp.innerHTML = `Temperature : ${Number(temp_f).toFixed(1)} °F`;                    
                    humidity.innerHTML = "Humidity : 35%";
                    wind.innerHTML = "Wind Speed : 12 km/h";
                }



                if (Number(tempr)>=36)
                {
                    precaution.style.backgroundColor = "rgb(193, 112, 112)";
                    precaution.innerHTML = "It's hot, please wear loose clothes and wear sunscreen while going out";


                    warning.innerHTML = "Warning:";
                }
                else if (Number(tempr)<=20)
                {
                    precaution.style.backgroundColor = "rgb(193, 112, 112)";
                    precaution.innerHTML = "It's cold, please wear tight clothes and wear moisturizer while going out";



                    warning.innerHTML = "Warning:";
                }
                else
                {
                    precaution.style.backgroundColor = "#90EE90";
                    precaution.innerHTML = "Enjoy the pleasent weather";    
                }
            }
        }
    </script>
</body>
</html>
