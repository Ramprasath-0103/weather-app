        <br>

        <br>

            <option>Trichy</option>

        <input style="margin-left: 10px;" type="button" value="Submit" onclick="DisplayWeather(this.form)"/>

        <br>
        <br>
        <br>

            <p style="margin-left:30px; font-size: 20px;" id="Wind"></p>
        </div>
        <br>
        <div>

        </div>
        <hr>
        <div style="border:1px solid white;border-radius:15px;margin: 35px;background-color: azure;">

    <script>
        function DisplayWeather(form)
        {
            const city = form.elements['City'].value;
            const format = form.elements['temperature'].value;

            const place = document.getElementById("place");
            const humidity = document.getElementById("Humidity");
            const wind = document.getElementById("Wind");
            const precaution = document.getElementById("precaution");

            if (city==="Chennai")
            {
                const tempr = "36.7";
                const temp_f = `${9/5*Number(tempr)+32}`;

                {
                    place.innerHTML = `Place : ${city}`;
                    temp.innerHTML = `Temperature : ${tempr} C`;
                    humidity.innerHTML = "Humidity : 35%";
                    wind.innerHTML = "Wind Speed : 12 km/h";
                }
